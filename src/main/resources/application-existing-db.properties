spring.config.import=optional:file:.env[.properties]

server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/backendTraining
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:none}}

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

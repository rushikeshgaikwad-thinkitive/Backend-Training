
spring.application.name=BackendTraining

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/backendTraining
spring.datasource.username=postgres
spring.datasource.password=Rushig@0702
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Actuator
management.endpoint.mappings.access=read-only
management.endpoints.web.exposure.include=health,mappings

# Logging
logging.level.root=INFO
logging.level.bt.com=DEBUG

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600000

# Optional initial administrator
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
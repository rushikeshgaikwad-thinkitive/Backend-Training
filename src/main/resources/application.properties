
spring.application.name=BackendTraining

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/backendTraining
spring.datasource.username=postgres
spring.datasource.password=Rushig@0702
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.mappings.access=read-only
management.endpoints.web.exposure.include=health,mappings

logging.level.root=INFO
logging.level.bt.com=DEBUG

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-2026-backend-training}
security.jwt.expiration=3600000
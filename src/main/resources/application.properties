spring.application.name=BackendTraining
# Use local development settings unless a deployment explicitly activates a profile.
spring.profiles.default=local
server.port=${SERVER_PORT:8080}

# Database values are supplied through environment variables in Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:backend_training}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Temporary development setting. Use validate with Liquibase-managed schema in later phase.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
management.endpoint.mappings.access=read-only
management.endpoints.web.exposure.include=health,mappings

logging.level.root=INFO
logging.level.bt.com=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Required by the current custom HS256 JWT implementation.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

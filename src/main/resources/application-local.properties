# IntelliJ/Spring Boot local runs can read the ignored project-root .env file.
spring.config.import=optional:file:.env[.properties]

# The host PostgreSQL port is configurable in .env (5433 avoids common local
# PostgreSQL installations already using 5432). Compose overrides these values
# with its internal service URL and container port.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:backend_training}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:update}}

# Keep the IDE-run API separate from the Docker-published port 8080.
server.port=${SERVER_PORT:8081}

# Local frontend dev servers commonly use different localhost ports.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

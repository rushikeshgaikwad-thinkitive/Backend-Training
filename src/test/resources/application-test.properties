spring.datasource.url=jdbc:h2:mem:ehr_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

security.jwt.secret=test-only-signing-key-with-at-least-32-bytes
security.jwt.expiration=3600000

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

security.bootstrap-admin.email=admin@example.test
security.bootstrap-admin.password=test-admin-password-123
